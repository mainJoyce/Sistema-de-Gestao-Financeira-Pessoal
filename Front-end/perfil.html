
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Perfil - Nome do Projeto</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- Cabeçalho -->

    <header class="dashboard-header">

        <div class="dashboard-logo">
            FinanceAI
        </div>

        <nav class="dashboard-menu">

            <a href="dashboard.html">
                Início
            </a>

            <a href="receita.html">
                Receita
            </a>

            <a href="despesa.html">
                Despesas
            </a>

            <a href="historico.html">
                Histórico
            </a>

            <a href="perfil.html" class="menu-ativo">
                Perfil
            </a>

        </nav>

        <a href="index.html" class="sair">
            Sair
        </a>

    </header>


    <!-- Conteúdo -->

    <main class="perfil">

        <div class="perfil-container">

            <div class="perfil-titulo">

                <h1>Gerenciar dados</h1>

                <p>
                    Consulte e atualize seus dados pessoais.
                </p>

            </div>


        <form id="formulario-perfil">
                <div class="campo">
    <label for="perfil-salario">
        Salário
    </label>

    <input
        type="number"
        id="perfil-salario"
        name="salario"
        placeholder="Digite seu salário"
        step="0.01"
    >
</div>

                <div class="campo">
                    <label for="perfil-nome">
                        Nome
                    </label>

                    <input
                        type="text"
                        id="perfil-nome"
                        name="nome"
                        placeholder="Digite seu nome"
                    >
                </div>


                <div class="campo">
                    <label for="perfil-email">
                        E-mail
                    </label>

                    <input
                        type="email"
                        id="perfil-email"
                        name="email"
                        placeholder="Digite seu e-mail"
                    >
                </div>


                <div class="campo">
                    <label for="perfil-endereco">
                        Endereço
                    </label>

                    <input
                        type="text"
                        id="perfil-endereco"
                        name="endereco"
                        placeholder="Digite seu endereço"
                    >
                </div>


                <div class="campo">
                    <label for="perfil-dependentes">
                        Dependentes
                    </label>

                    <input
                        type="number"
                        id="perfil-dependentes"
                        name="dependentes"
                        placeholder="Quantidade de dependentes"
                        min="0"
                    >
                </div>


                <button type="submit" id="btn-confirmar">
                    Confirmar

                </button>

            </form>

        </div>

    </main>


    <footer class="footer">

        <p>
            © 2026 FinanceAI
        </p>

    </footer>

<script src="js/script.js"></script>
</body>

</html>
