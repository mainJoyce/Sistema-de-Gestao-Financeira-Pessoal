<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Criar conta · FinanceAI</title><link rel="stylesheet" href="css/style.css"></head><body><main class="auth-page"><section class="auth-card"><div class="auth-logo"><span>●</span> FinanceAI</div><h1>Criar conta</h1><p class="subtitle">Preencha seus dados para começar sua organização financeira.</p><div class="steps"><div class="step active"><b>1</b>Dados pessoais</div><div class="step"><b>2</b>Financeiro</div><div class="step"><b>3</b>Segurança</div></div><form id="signup-form"><div class="field"><label>Nome completo</label><input required placeholder="Digite seu nome"></div><div class="field"><label>E-mail</label><input type="email" required placeholder="voce@email.com"></div><div class="field"><label>CPF</label><input required placeholder="000.000.000-00" maxlength="14"></div><div class="field"><label>Renda mensal (R$)</label><input type="number" min="0" step=".01" placeholder="0,00"></div><div class="field"><label>Senha</label><input type="password" required minlength="6" placeholder="Crie uma senha"></div><div class="field"><label>Confirmar senha</label><input type="password" required minlength="6" placeholder="Digite novamente a senha"></div><button style="width:100%">Criar minha conta →</button></form><div class="auth-foot">Já possui uma conta? <a href="login.html">Entrar</a></div></section></main><script src="js/script.js"></script></body></html>
