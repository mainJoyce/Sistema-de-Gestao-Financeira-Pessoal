
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Criar conta - FinanceAI</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <main class="pagina-cadastro">

        <div class="cadastro-container">

            <div class="cadastro-logo">
                FinanceAI
            </div>

            <h1>Criar conta</h1>

            <p class="cadastro-subtitulo">
                Preencha seus dados para criar sua conta.
            </p>

<form id="formulario-cadastro">

                <!-- Dados pessoais -->

                <div class="campo">
                    <label for="nome">Nome</label>

                    <input
                        type="text"
                        id="nome"
                        name="nome"
                        placeholder="Digite seu nome"
                    >
                </div>


                <div class="campo">
                    <label for="cpf-cadastro">CPF</label>

                    <input
                        type="text"
                        id="cpf-cadastro"
                        name="cpf"
                        placeholder="Digite seu CPF"
                        maxlength="14"
                    >
                </div>


                <div class="campo">
                    <label for="email">E-mail</label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Digite seu e-mail"
                    >
                </div>


                <div class="campo">
                    <label for="renda">Renda mensal</label>

                    <input
                        type="number"
                        id="renda"
                        name="renda"
                        placeholder="Digite sua renda mensal"
                        min="0"
                        step="0.01"
                    >
                </div>


                <div class="campo">
                    <label for="endereco">Endereço</label>

                    <input
                        type="text"
                        id="endereco"
                        name="endereco"
                        placeholder="Digite seu endereço"
                    >
                </div>


                <div class="campo">
                    <label for="dependentes">Dependentes</label>

                    <input
                        type="number"
                        id="dependentes"
                        name="dependentes"
                        placeholder="Quantidade de dependentes"
                        min="0"
                    >
                </div>


                <div class="campo">
                    <label for="senha-cadastro">Senha</label>

                    <input
                        type="password"
                        id="senha-cadastro"
                        name="senha"
                        placeholder="Digite sua senha"
                    >
                </div>


                <div class="campo">
                    <label for="confirmar-senha">Confirme sua senha</label>

                    <input
                        type="password"
                        id="confirmar-senha"
                        name="confirmar-senha"
                        placeholder="Digite sua senha novamente"
                    >
                </div>


                <button type="submit" class="btn-cadastro-form">
                    Concluir
                </button>

            </form>


            <div class="ja-possui-conta">
                <p>
                    Já possui uma conta?
                    <a href="login.html">Entrar</a>
                </p>
            </div>


            <a href="index.html" class="voltar">
                ← Voltar para a página inicial
            </a>

        </div>

    </main>
<script src="js/script.js"></script>

</body>

</html>
