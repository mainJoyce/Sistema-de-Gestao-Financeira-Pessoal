
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cadastrar Receita - FinanceAI</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- Cabeçalho -->

    <header class="dashboard-header">

        <div class="dashboard-logo">
            FinanceAI
        </div>

        <nav class="dashboard-menu">

            <a href="dashboard.html">
                Início
            </a>

            <a href="receita.html" class="menu-ativo">
                Receita
            </a>

            <a href="despesa.html">
                Despesas
            </a>

            <a href="historico.html">
                Histórico
            </a>

            <a href="perfil.html">
                Perfil
            </a>

        </nav>

        <a href="index.html" class="sair">
            Sair
        </a>

    </header>


    <!-- Conteúdo -->

    <main class="pagina-transacao">

        <div class="transacao-container">

            <div class="transacao-titulo">

                <h1>Cadastrar receita</h1>

                <p>
                    Cadastre uma nova receita para acompanhar
                    suas entradas financeiras.
                </p>

            </div>

             <form id="formulario-receita">

                <!-- Receita -->

                <div class="campo">

                    <label for="receita">
                        Receita
                    </label>

                    <input
                        type="text"
                        id="receita"
                        name="receita"
                        placeholder="Ex.: Salário"
                    >

                </div>


                <!-- Categoria -->

                <div class="campo">

                    <label for="categoria-receita">
                        Categoria
                    </label>

                    <select
                        id="categoria-receita"
                        name="categoria"
                    >

                        <option value="">
                            Selecione uma categoria
                        </option>

                        <option value="salario">
                            Salário
                        </option>

                        <option value="freelance">
                            Freelance
                        </option>

                        <option value="investimento">
                            Investimento
                        </option>

                        <option value="outros">
                            Outros
                        </option>

                    </select>

                </div>


                <!-- Valor -->

                <div class="campo">

                    <label for="valor-receita">
                        Valor
                    </label>

                    <input
                        type="number"
                        id="valor-receita"
                        name="valor"
                        placeholder="R$ 0,00"
                        min="0"
                        step="0.01"
                    >

                </div>


                <!-- Descrição -->

                <div class="campo">

                    <label for="descricao-receita">
                        Descrição
                    </label>

                    <textarea
                        id="descricao-receita"
                        name="descricao"
                        placeholder="Digite uma descrição"
                        rows="4"
                    ></textarea>

                </div>


                <!-- Data -->

                <div class="campo">

                    <label for="data-receita">
                        Data
                    </label>

                    <input
                        type="date"
                        id="data-receita"
                        name="data"
                    >

                </div>


                <!-- Ocorrência -->

                <div class="campo">

                    <label for="ocorrencia">
                        Ocorrência
                    </label>

                    <select
                        id="ocorrencia"
                        name="ocorrencia"
                    >

                        <option value="">
                            Selecione
                        </option>

                        <option value="unica">
                            Única
                        </option>

                        <option value="mensal">
                            Mensal
                        </option>

                        <option value="semanal">
                            Semanal
                        </option>

                        <option value="anual">
                            Anual
                        </option>

                    </select>

                </div>


                <button
                    type="submit"
                    class="btn-salvar"
                >
                    Salvar
                </button>

            </form>

        </div>

    </main>


    <footer class="footer">

        <p>
            © 2026 FinanceAI
        </p>

    </footer>
<script src="js/script.js"></script>
</body>

</html>
