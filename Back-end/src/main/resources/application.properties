spring.application.name=gestao-financeira

spring.datasource.url=jdbc:mysql://localhost:3306/gestao_financeira?serverTimezone=America/Recife&allowPublicKeyRetrieval=true&useSSL=false
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.servlet.multipart.max-file-size=1MB
spring.servlet.multipart.max-request-size=1MB

jwt.secret=${JWT_SECRET:troque-esta-chave-por-uma-bem-longa-com-mais-de-32-caracteres}
jwt.expiration-seconds=3600