spring.application.name=gestao-financeira


spring.datasource.url=jdbc:mysql://localhost:${DB_PORT:3307}/gestao_financeira?serverTimezone=America/Recife&allowPublicKeyRetrieval=true&useSSL=false
spring.datasource.username=${DB_USER:root}
spring.datasource.password=777

# validate = o Hibernate so CONFERE se as classes batem com as tabelas, nunca altera o banco
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.servlet.multipart.max-file-size=1MB
spring.servlet.multipart.max-request-size=1MB

# Chave de assinatura do JWT (minimo 32 caracteres). Em producao, defina JWT_SECRET.
jwt.secret=${JWT_SECRET:troque-esta-chave-por-uma-bem-longa-com-mais-de-32-caracteres}
jwt.expiration-seconds=3600

# IA (opcional). Sem GEMINI_API_KEY o sistema usa textos gerados por regras.
# O backend envia apenas totais agregados (nunca nome, CPF, e-mail ou descricoes).
ia.gemini.api-key=${GEMINI_API_KEY:}
ia.gemini.model=${GEMINI_MODEL:gemini-2.0-flash}
ia.gemini.timeout-segundos=10
